# Workspace-root config only. This directory is a monorepo of installable packages
# under `packages/*/` — each has its own `[project]` + `[build-system]`. The root is
# NOT itself a distributable package; it only carries the shared ruff + pytest config
# so every package is linted and tested the same way from one place.

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["packages", "conformance"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)` in the signature
# default — B008 ("no function call in argument default") is a false positive for it.
"packages/agentship-service/**" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `packages` = the per-package unit/integration suites; `conformance` = the
# top-level engine×capability matrix (DESIGN §11) that runs over every registered
# engine and fails the build on any over-declared capability.
testpaths = ["packages", "conformance"]
# The `live` marker tags tests that need a real API key and actually call OpenAI
# (for example, the test that checks streaming really sends tokens one at a time).
# They skip themselves in the normal no-key tests and run in the daily real-API job.
markers = ["live: needs a real API key; runs in the daily real-API job, not the normal no-key tests"]
