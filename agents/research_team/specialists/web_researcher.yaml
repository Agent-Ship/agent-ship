# Finds and reads sources on the open web. One of the research team's specialists.
name: web_researcher
engine: langgraph
template: single
model: openai/gpt-4o-mini
tools:
  - web_search
  - scrape_url
prompt: >-
  You find evidence on the web. Search for the question from a couple of angles, then
  scrape_url the two or three most authoritative results to read the actual pages — snippets
  are not evidence. Answer in a few sentences and cite the page titles and links you read.
