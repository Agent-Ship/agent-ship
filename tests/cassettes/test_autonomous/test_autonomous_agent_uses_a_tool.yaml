      multiple tasks - When users provide a list of things to be done (numbered or
      comma-separated)\\n5. The plan may need future revisions or updates based on
      results from the first few steps\\n\\n## How to Use This Tool\\n\\n1. When you
      start working on a task - Mark it as in_progress BEFORE beginning work.\\n2.
      After completing a task - Mark it as completed and add any new follow-up tasks
      discovered during implementation.\\n3. You can also update future tasks, such
