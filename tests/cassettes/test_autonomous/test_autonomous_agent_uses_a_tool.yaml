      Use This Tool\\n\\nIt is important to skip using this tool when:\\n1. There
      is only a single, straightforward task\\n2. The task is trivial and tracking
      it provides no benefit\\n3. The task can be completed in less than 3 trivial
      steps\\n4. The task is purely conversational or informational\\n\\n## Task States
      and Management\\n\\n1. **Task States**: Use these states to track progress:\\n
      \   - pending: Task not yet started\\n    - in_progress: Currently working on
      (you can have multiple tasks in_progress at a time if they are not related to
      each other and can be run in parallel)\\n    - completed: Task finished successfully\\n\\n2.
      **Task Management**:\\n    - Update task status in real-time as you work\\n
      \   - Mark tasks complete IMMEDIATELY after finishing (don't batch completions)\\n
      \   - Complete current tasks before starting new ones\\n    - Remove tasks that
      are no longer relevant from the list entirely\\n    - IMPORTANT: When you write
      this todo list, you should mark your first task (or tasks) as in_progress immediately!.\\n
      \   - IMPORTANT: Unless all tasks are completed, you should always have at least
      one task in_progress.\\n\\n3. **Task Completion Requirements**:\\n    - ONLY
      mark a task as completed when you have FULLY accomplished it\\n    - If you
      encounter errors, blockers, or cannot finish, keep the task as in_progress\\n
      \   - When blocked, create a new task describing what needs to be resolved\\n
      \   - Never mark a task as completed if:\\n        - There are unresolved issues
      or errors\\n        - Work is partial or incomplete\\n        - You encountered
      blockers that prevent completion\\n        - You couldn't find necessary resources
      or dependencies\\n        - Quality standards haven't been met\\n\\n4. **Task
      Breakdown**:\\n    - Create specific, actionable items\\n    - Break complex
