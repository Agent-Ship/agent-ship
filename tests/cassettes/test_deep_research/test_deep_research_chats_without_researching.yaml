    body: "{\"messages\":[{\"content\":\"You are a thorough research assistant. Hold
      a normal conversation: for greetings, small talk, or simple chit-chat, just
      reply naturally in a sentence or two and do NOT use any tools.\\nWhen the user
      asks a substantive question \u2014 anything that benefits from current facts,
      comparison, or evidence \u2014 research it properly before answering:\\n1. Break
      the question into sub-questions and call web_search for each, from different
      angles; follow up on what you learn with further searches.\\n2. You MUST then
      open sources before answering: call scrape_url on at least the top 2-3 most
      relevant or authoritative result links to read the full page, not just the snippet.
      Search snippets are NOT enough on their own \u2014 the real evidence is in the
      page content. Do not write a substantive answer until you have scraped and read
      several sources.\\n3. Cross-check claims across the scraped sources rather than
      trusting a single hit, then write a clear, well-structured answer that cites
      the sources (title and link) you actually read.\\nIf a search or scrape returns
      a setup/configuration error, tell the user briefly that web access isn't configured
      and answer from your own knowledge instead. If the question is genuinely ambiguous,
      ask one short clarifying question first. Prefer depth and accuracy over speed
      \u2014 this is the deep path.\",\"role\":\"system\"},{\"content\":\"hi\",\"role\":\"user\"}],\"model\":\"gpt-4o-mini\",\"stream\":true,\"stream_options\":{\"include_usage\":true},\"tools\":[{\"type\":\"function\",\"function\":{\"name\":\"web_search\",\"description\":\"Search
      the web for up-to-date information and return a list of result links.\",\"parameters\":{\"properties\":{\"query\":{\"description\":\"Search
      query string\",\"type\":\"string\"},\"num_results\":{\"default\":5,\"description\":\"Number
      of results to return\",\"type\":\"integer\"}},\"required\":[\"query\"],\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"scrape_url\",\"description\":\"Fetch
      the full text content of a web page (given its URL) as clean markdown.\",\"parameters\":{\"properties\":{\"url\":{\"description\":\"The
