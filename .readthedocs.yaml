# Read the Docs build for https://docs.agent-ship.dev
#
# That domain currently serves Sphinx docs built from the RETIRED `agent-ship` repository —
# "AgentShip 1.0.0 documentation" — because this repository never had a Read the Docs config,
# so nothing ever pointed the project here. This file is half the fix; the other half is a
# dashboard change (see README → Documentation), because the project's repository URL cannot
# be set from inside the repository it is being moved to.
#
# The site itself is MkDocs Material, the same build `make docs-serve` runs locally, so what
# lands on the domain is what a contributor sees before pushing.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml
  # Fail the build on a broken internal link or a page missing from nav, matching CI. A docs
  # site that silently ships dead links is worse than one that fails loudly.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
