name: Release

# Releases are cut from a TAG, never from a branch, so what is published is a fixed,
# named commit that can be checked out again years later.
#
#   python scripts/versions.py --set 0.1.0
#   git commit -am "release: 0.1.0" && git tag v0.1.0 && git push origin v0.1.0
#
# TestPyPI runs on every tag. PyPI runs only after TestPyPI has published AND the
# packages have been installed back out of it and smoke-tested — a real index resolve,
# not a local file path, because that is where a bad pin or a missing dependency shows up.
#
# Publishing uses Trusted Publishing (OIDC): no API token is stored in this repository.
# Configure each project once at https://pypi.org/manage/account/publishing/ with owner
# Agent-Ship · repo agent-ship · workflow release.yml · environment pypi-<package>.
#
# CLAIMING THE NAMES THE FIRST TIME. PyPI allows at most THREE pending trusted publishers
# at once, and a pending publisher stops counting once it has been used — publishing turns
# it into a normal publisher on the project it just created. So the first claim goes in two
# waves of three, which is what the `packages` input below is for:
#
#   1. register pending publishers for core, langgraph, cli
#   2. Run workflow -> packages: agentship-core,agentship-langgraph,agentship-cli
#   3. register pending publishers for service, observability, sdk
#   4. Run workflow -> packages: agentship-service,agentship-observability,agentship-sdk
#
# After that all six projects exist and every later release publishes all of them at once.
on:
  # The only thing that publishes. Pushing to a branch never reaches an index; a tag does.
  push:
    tags: ["v*"]
  # Lets you rehearse the whole thing against TestPyPI without cutting a tag. The inputs
  # below only apply to a manual run — a tag publishes every package, to both indexes.
  # No secret is set, so both auth paths end at Trusted Publishing (OIDC); see
  # docs/RELEASING.md.
  workflow_dispatch:
    inputs:
      packages:
        description: 'Which packages to publish — "all", or a comma-separated subset'
        default: all
        required: false
      target:
        description: 'Where to publish. A tag always does testpypi -> verify -> pypi.'
        type: choice
        options: [testpypi, pypi, both]
        default: testpypi
        required: false
      auth:
        description: 'How to authenticate: the stored token, or Trusted Publishing (OIDC).'
        type: choice
        options: [token, trusted-publishing]
        default: token
        required: false
jobs:
  plan:
    name: Decide which packages to publish
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      complete: ${{ steps.plan.outputs.complete }}
    steps:
      - id: plan
        name: Resolve the package list
        run: |
          all='agentship-core agentship-langgraph agentship-service agentship-observability agentship-cli agentship-sdk'
          requested='${{ inputs.packages }}'
          # A tag release always publishes everything; only a manual run may subset.
          if [ -z "$requested" ] || [ "$requested" = "all" ]; then
            selected="$all"; complete=true
          else
            selected="$(echo "$requested" | tr ',' ' ')"; complete=false
          fi
          for pkg in $selected; do
            case " $all " in
              *" $pkg "*) ;;
              *) echo "unknown package: $pkg" >&2; echo "known: $all" >&2; exit 1 ;;
            esac
          done
          echo "matrix=$(printf '%s\n' $selected | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "publishing: $selected (complete set: $complete)"

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install --upgrade pip build twine

      - name: Check version lockstep
        run: python scripts/versions.py --check

      # A tag that disagrees with the packages is the single most confusing release
      # failure: the index ends up with a version nobody tagged. Fail before publishing.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(python -c "import sys; sys.path.insert(0, 'scripts'); \
            import versions; print(versions.declared_version(versions.pyprojects()[0]))")
          if [ "$tag" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match packaged version $packaged" >&2
            echo "run: python scripts/versions.py --set $tag" >&2
            exit 1
          fi
          echo "tag and packages agree on $packaged"

      # A release with no notes is one nobody wrote. Cheaper to fail here than to discover
      # it after six uploads, when the version is burned and the page is already public.
      - name: Check the changelog has a section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/changelog.py --check "${GITHUB_REF_NAME#v}"

      - name: Build every wheel and sdist
        run: |
          for pkg in agentship-core agentship-langgraph agentship-service \
                     agentship-observability agentship-cli agentship-sdk; do
            python -m build --outdir dist "packages/$pkg"
          done

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    # One job per package, each with its OWN environment name.
    #
    # PyPI allows only one PENDING trusted publisher per
    # (owner, repository, workflow, environment) combination. A single publish job means
    # all six projects would share one identical config, and PyPI rejects the second with
    # "already been registered for a different project name". Distinct environments make
    # each project's publisher unique.
    #
    # Each job uploads ONLY its own package's files: pypa/gh-action-pypi-publish uploads
    # everything in packages-dir, and a job may only publish the project its OIDC token
    # is scoped to.
    name: TestPyPI ${{ matrix.package }}
    needs: [plan, build]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || inputs.target == 'testpypi'
      || inputs.target == 'both'
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel the others because one failed — a half-published release is easier
      # to reason about when you can see exactly which packages made it.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment:
      name: testpypi-${{ matrix.package }}
      url: https://test.pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write        # required for Trusted Publishing; no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      # Wheel filenames normalise hyphens to underscores (agentship-core ->
      # agentship_core-0.1.0-py3-none-any.whl), so match on the underscored prefix.
      - name: Isolate this package's distributions
        run: |
          mkdir -p upload
          prefix="$(echo '${{ matrix.package }}' | tr '-' '_')"
          cp "dist/$prefix-"* upload/
          echo "publishing:"; ls -1 upload

      # Token auth when TEST_PYPI_API_TOKEN is set; Trusted Publishing (OIDC) otherwise.
      # An empty `password` makes the action fall back to OIDC, so one step covers both and
      # switching is a matter of setting or clearing a secret.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
          password: ${{ inputs.auth == 'trusted-publishing' && '' || secrets.TEST_PYPI_API_TOKEN }}
          # A re-run of the same tag should not fail the release on an already-uploaded file.
          skip-existing: true

  verify-testpypi:
    name: Install from TestPyPI and smoke-test
    needs: [plan, testpypi]
    # Installing agentship-sdk resolves every sibling, so this can only pass once all six
    # are on the index. A partial claim run skips it rather than failing on a package that
    # has deliberately not been published yet.
    if: >-
      needs.plan.outputs.complete == 'true'
      && needs.testpypi.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The gate that makes TestPyPI worth the extra step: resolve through a REAL index.
      # Local wheels are installed by file path, which cannot catch a sibling pin that no
      # index can satisfy or a dependency that was never declared.
      #
      # --extra-index-url, not --index-url: the third-party dependencies live on real
      # PyPI, and only our own packages are on TestPyPI.
      # The version comes from the packages, not from the ref: a manual rehearsal runs on a
      # branch, where GITHUB_REF_NAME is "main" and "==main" is not a version anyone can
      # resolve. The build job has already proven a tag agrees with this same number.
      - name: Resolve the version being verified
        id: version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'scripts'); \
            import versions; print(versions.declared_version(versions.pyprojects()[0]))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "verifying $version"

      - name: Install the published packages from TestPyPI
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5; do
            if pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "agentship-sdk[starter]==${{ steps.version.outputs.version }}"; then
              exit 0
            fi
            echo "index not ready yet, retrying in 20s ($attempt/5)"
            sleep 20
          done
          # Falling out of the loop means five attempts failed. Say so and stop, rather
          # than letting the smoke-test step below fail with a confusing "command not found".
          echo "could not install from TestPyPI after 5 attempts" >&2
          exit 1

      - name: Smoke-test what a user would actually get
        run: |
          agentship --help > /dev/null
          python - <<'EOF'
          import agentship
          assert "site-packages" in agentship.__file__, agentship.__file__
          print("installed from TestPyPI:", agentship.__file__)
          EOF

      # `--help` and an import prove the wheels unpack, not that the product works. 0.0.1
      # passed both and still could not run an agent: observability defaulted to a provider
      # the starter stack does not install, so the first command in the README failed. Run
      # the quickstart itself — keyless, in a clean directory, with no provider key in the
      # environment — so the next release cannot ship that class of bug again.
      - name: Run the README quickstart, exactly as a new user would
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: |
          mkdir -p "$RUNNER_TEMP/quickstart"
          cd "$RUNNER_TEMP/quickstart"
          cat > hello.yaml <<'EOF'
          name: hello
          engine: echo
          prompt: A stand-in agent that needs no provider.
          EOF
          out=$(agentship run hello.yaml --input "hi there")
          echo "$out"
          case "$out" in
            *"hi there"*) echo "quickstart works" ;;
            *) echo "quickstart did not echo the input" >&2; exit 1 ;;
          esac

  pypi:
    name: PyPI ${{ matrix.package }}
    needs: [plan, build, testpypi, verify-testpypi]
    # A tag always goes through TestPyPI and the install-back-out check first. A manual run
    # may target PyPI directly — needed to CLAIM the names, since a pending publisher only
    # converts to a real one by publishing, and TestPyPI is a separate registry whose
    # publishers reserve nothing on PyPI.
    #
    # `always()` so this can still run when TestPyPI was skipped, but the result checks
    # below mean a TestPyPI or verify FAILURE still stops it. Skipped is fine; failed is not.
    if: >-
      always()
      && needs.build.result == 'success'
      && needs['testpypi'].result != 'failure'
      && needs['verify-testpypi'].result != 'failure'
      && (startsWith(github.ref, 'refs/tags/v')
          || inputs.target == 'pypi'
          || inputs.target == 'both')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Isolate this package's distributions
        run: |
          mkdir -p upload
          prefix="$(echo '${{ matrix.package }}' | tr '-' '_')"
          cp "dist/$prefix-"* upload/
          echo "publishing:"; ls -1 upload

      # Token auth when PYPI_API_TOKEN is set; Trusted Publishing (OIDC) otherwise.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          password: ${{ inputs.auth == 'trusted-publishing' && '' || secrets.PYPI_API_TOKEN }}
          # Re-running a release must not fail on a file that already went up.
          skip-existing: true

  github-release:
    name: Create the GitHub release
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/v') && needs.pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      # The release page and the changelog must not be two accounts of the same release.
      # `--generate-notes` alone writes the page from PR titles, which is a list of what was
      # merged rather than a description of what changed — so the curated section wins, and
      # the generated commit list is appended under it for anyone who wants the detail.
      - name: Take the notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/changelog.py --section "$version" > "$RUNNER_TEMP/notes.md"
          echo "notes for $version:"; cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release with its distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
