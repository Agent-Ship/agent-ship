name: JOSS paper draft

on:
  push:
    paths:
      - paper.md
      - paper.bib
      - figures/**
      - .github/workflows/joss-paper.yml
  pull_request:
    paths:
      - paper.md
      - paper.bib
      - figures/**
      - .github/workflows/joss-paper.yml
  workflow_dispatch:

jobs:
  paper:
    name: Build draft PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper.md

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
