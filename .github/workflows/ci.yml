name: ci

# Runs the demo's LIVE test suite (one slice per capability) on every push / PR.
# Every test makes a real call to the OpenAI API, so this needs the OPENAI_API_KEY
# repo secret. Set it under Settings -> Secrets and variables -> Actions. Without it,
# the tests skip cleanly (they never fake-pass), so the workflow still succeeds.
#
# LIMITATION: AgentShip is not published to PyPI yet, so this workflow installs the
# framework editable from a SIBLING CHECKOUT of the monorepo. Once the framework
# publishes, delete the second checkout step and the editable install and replace
# them with:  pip install "agentship[starter]==0.0.1"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the demo repo
        uses: actions/checkout@v4
        with:
          path: agentship-demo

      # TEMPORARY: needed only until the framework is on PyPI. Assumes the framework
      # monorepo lives at `<owner>/agentship`; adjust `repository`/`ref` as needed.
      - name: Check out the AgentShip framework (sibling, editable-local install)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agentship
          path: agentship
        continue-on-error: true  # tolerate until the framework repo/pin is public

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install (editable-local until framework is published)
        working-directory: agentship-demo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the LIVE test suite (needs the OPENAI_API_KEY secret; skips without it)
        working-directory: agentship-demo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest -q
