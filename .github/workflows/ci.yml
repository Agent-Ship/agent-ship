name: CI

# The gate: the full offline suite on every push and PR, on every branch.
#
# This used to list `[main, "feat/**"]`, so no push to v1 was ever tested — which is how
# three modules that eleven tracked files import were absent from HEAD for weeks while the
# local tree stayed green. A gate that does not run on the branch you work on is not a gate.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Kept so the gate can also be run by hand against any branch.
  workflow_dispatch:

# A new push to the same branch cancels the previous run: nobody needs CI results for a
# commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # All SIX packages. Installing only three left agentship-service,
      # agentship-observability and the `agentship` meta-package untested: their suites
      # were collected but their own dependencies were never resolved.
      - name: Install every package (editable) + dev tooling
        run: |
          python -m pip install --upgrade pip
          # WITH extras: the suite covers the optional paths too (jwt auth, the postgres
          # checkpointer, MCP, deepagents). A bare editable install collects those tests and
          # then fails to import them — locally they passed only because this machine's venv
          # had accumulated the extras by hand.
          pip install \
            -e 'packages/agentship-core[postgres,jwt]' \
            -e 'packages/agentship-langgraph[autonomous,mcp,postgres]' \
            -e 'packages/agentship-service[serve,a2a]' \
            -e 'packages/agentship-observability[phoenix]' \
            -e packages/agentship-cli \
            -e packages/agentship-sdk
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Enforced so formatting is never a review topic again: the tool decides, and a
      # diff that is only whitespace can no longer hide a real change inside it.
      - name: Format check
        run: ruff format --check .

      # Bare `pytest` honours testpaths = ["packages", "conformance"]. The old
      # `pytest packages` silently skipped the whole conformance matrix — the suite whose
      # entire job is to fail the build when an engine over-declares a capability.
      - name: Test
        run: pytest -q

  package:
    name: Build wheels and test what ships
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      # Before building anything: the six versions must match and every sibling
      # dependency must pin exactly that version. A release with one version missed is a
      # broken release that looks fine until somebody installs it.
      - name: Check version lockstep
        run: python scripts/versions.py --check

      - name: Build every wheel and sdist
        run: |
          for pkg in agentship-core agentship-langgraph agentship-service \
                     agentship-observability agentship-cli agentship-sdk; do
            python -m build --outdir dist "packages/$pkg"
          done
          ls -l dist

      # Catches metadata a package index would reject — a malformed classifier, a
      # description that will not render — before a release does, not after.
      - name: Check distribution metadata
        run: twine check dist/*

      # The point of this job. The `test` job installs editable from the source tree, so
      # it passes whether or not a file was ever committed: that is how three modules
      # imported by eleven tracked files stayed missing from HEAD. Here nothing is
      # editable and nothing is on the path but what the wheels contain.
      - name: Install the built wheels into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          # Resolve each wheel to its real filename first. Appending "[extras]" to a glob
          # gives pip the literal string "agentship_core-*[postgres,jwt]", which it rejects
          # as an invalid wheel filename — the shell never expands a pattern that is glued
          # to a quoted suffix the way it looks like it should.
          resolve() { ls "dist/$1-"*.whl | head -1; }
          /tmp/clean/bin/pip install \
            "$(resolve agentship_core)[postgres,jwt]" \
            "$(resolve agentship_langgraph)[autonomous,mcp,postgres]" \
            "$(resolve agentship_service)[serve,a2a]" \
            "$(resolve agentship_observability)[phoenix]" \
            "$(resolve agentship_cli)" \
            "$(resolve agentship_sdk)"
          /tmp/clean/bin/pip install -r requirements-dev.txt

      # Without this the job could pass by importing the source tree and prove nothing.
      # The src/ layout should make that impossible; this asserts it rather than trusting it.
      - name: Assert the tests will import the INSTALLED package
        run: |
          /tmp/clean/bin/python - <<'EOF'
          import agentship, agentship.conformance, agentship_cli.verify, agentship_langgraph.testing
          assert "site-packages" in agentship.__file__, (
              f"importing the source tree, not the wheel: {agentship.__file__}"
          )
          print("importing from the wheel:", agentship.__file__)
          EOF

      - name: Test against the installed wheels
        run: /tmp/clean/bin/python -m pytest -q

      - name: Check the CLI entry point actually runs
        run: |
          /tmp/clean/bin/agentship --help > /dev/null
          /tmp/clean/bin/agentship verify --help > /dev/null

      - name: Keep the distributions for inspection
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
