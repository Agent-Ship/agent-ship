name: CI

# The gate (operating-model.md): the full offline suite runs on every push/PR to
# main and feat/** branches. No secrets, offline only — Phase 0 has no network paths.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the packages (editable) + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/agentship-core -e packages/agentship-langgraph -e packages/agentship-cli
          pip install 'pytest>=8' 'pytest-asyncio>=0.23' 'pytest-recording>=0.13' 'ruff>=0.6'

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest packages -q
